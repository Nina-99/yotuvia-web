# Yotuvia — nginx server block
#
# /etc/nginx/sites-available/yotuvia.conf
#
# Serves the SPA from /srv/yotuvia/web, the uploads from /srv/yotuvia/uploads
# and proxies /api/ to the Go process on 127.0.0.1:8080.
#
# Path contract: the API writes uploads relative to its WorkingDirectory
# (/srv/yotuvia), so `root /srv/yotuvia` here and WorkingDirectory there must
# stay in sync. Nothing else needs `alias`.

upstream yotuvia_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name yotuvia.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yotuvia.com;

    ssl_certificate     /etc/letsencrypt/live/yotuvia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yotuvia.com/privkey.pem;

    # Feed videos reach the API's 100MB cap; leave multipart overhead room.
    client_max_body_size 110M;

    # ─── Transport headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # The SPA build injects the rest of the CSP as <meta>; `frame-ancestors`
    # is ignored there, so clickjacking protection must come from this header.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # ─── API ────────────────────────────────────────────────────────────────
    # Includes GET /api/healthz (readiness probe used by deploy-api.sh).
    location /api/ {
        proxy_pass http://yotuvia_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The API emits HSTS only when it sees https here, and its per-IP rate
        # limit reads X-Real-IP; without these every request looks local.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─── Uploads ────────────────────────────────────────────────────────────
    location /uploads/ {
        root /srv/yotuvia;
        autoindex off;

        # The API derives extensions from real bytes, so nothing executable
        # should land here. Second layer: anything else is an opaque download.
        location ~* \.(jpe?g|png|webp|gif|mp4|mov|webm|svg|ico)$ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
        }

        location ~* \. {
            default_type application/octet-stream;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # ─── SPA ────────────────────────────────────────────────────────────────
    root /srv/yotuvia/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached, or a new
    # deploy leaves users on the old bundle.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|webp|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
}
